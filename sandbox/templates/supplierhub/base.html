<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}SupplierHub{% endblock %} · SupplierHub</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1d2733; }
  header { background: #0f4c81; color: #fff; padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; }
  header .brand { font-weight: 700; font-size: 20px; letter-spacing: .3px; }
  header a { color: #cfe3ff; margin-left: 16px; text-decoration: none; }
  main { max-width: 1000px; margin: 28px auto; background: #fff; padding: 24px 32px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e3e8ef; font-size: 14px; }
  th { background: #f0f3f7; }
  td.num, th.num { text-align: right; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .Open { background: #fff3cd; } .Paid { background: #d4edda; } .Applied { background: #e2e3e5; }
  .muted { color: #6b7785; font-size: 13px; }
  .error { background: #fde2e1; color: #8a1c1c; padding: 8px 12px; border-radius: 4px; }
  input, select, button { font-size: 14px; padding: 6px 8px; }
  button { background: #0f4c81; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  .pager a, .pager span { margin-right: 10px; }
</style>
</head>
<body>
<header>
  <span class="brand">SupplierHub</span>
  <nav>{% if user %}Signed in as {{ user }} · Customer: Northwind Traders <a href="/invoices">Documents</a> <a href="/logout">Sign out</a>{% endif %}</nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>

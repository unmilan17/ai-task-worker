{% extends "supplierhub/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in to SupplierHub</h1>
<p class="muted">Customer portal for viewing supplier invoices and credit notes.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <p><label for="username">Username</label><br><input id="username" name="username" autocomplete="username"></p>
  <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password"></p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}

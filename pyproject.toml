[project]
name = "ai-task-worker"
version = "0.1.0"
description = "Autonomous AI Task Worker - takes a natural-language task and completes it on a computer (browser, APIs, files) with verification and human-in-the-loop safety."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "playwright>=1.45",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pypdf>=4.0",
  "fpdf2>=2.7",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
worker = "worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*", "sandbox*", "evals*"]

[tool.setuptools.package-data]
worker = ["tools/*.js", "core/*.html", "server/static/*"]
sandbox = ["templates/**/*", "test_credentials.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
